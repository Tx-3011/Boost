[package]
name = "boost"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
network-interface = "2"
serde = { version = "1", features = ["derive"] }
socket2 = "0.6"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_UI_Controls_Dialogs", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
